<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contato | Coser Clau Dias</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link
        rel="icon"
        type="image/png"
        href="assets/img/Casinha Coser.png"
    >

    <style>

        .contact-container{

            max-width:600px;

            margin:4rem auto;

            padding:2rem;

            background:white;

            border-radius:20px;

            box-shadow:0 5px 20px rgba(0,0,0,0.05);

        }

        .form-group{

            margin-bottom:1.5rem;

        }

        .form-group label{

            display:block;

            margin-bottom:0.5rem;

            font-weight:600;

        }

        .form-group input,
        .form-group textarea{

            width:100%;

            padding:0.9rem;

            border:1px solid #ddd;

            border-radius:10px;

            font-family:inherit;

        }

        .form-group textarea{

            height:150px;

            resize:none;

        }

        .submit-btn{

            width:100%;

            border:none;

            cursor:pointer;

            font-size:1rem;

            font-weight:bold;

        }

    </style>

</head>

<body>

<!-- LOADER -->

<div id="loader">

    <img
        src="assets/img/botao_coser.png"
        alt="Logo"
        class="loader-logo"
    >

</div>

<!-- HEADER -->

<header>

    <div class="logo-container">

        <img
            src="assets/img/Casinha Coser.png"
            alt="Casinha Coser"
            class="logo-casinha"
        >

        <img
            src="assets/img/Coser marrom.png"
            alt="Coser Clau Dias"
            class="logo-escrita"
        >

    </div>

    <nav>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="catalogo.html">Catálogo</a>
            </li>

            <li>
                <a href="sobre.html">Sobre</a>
            </li>

            <li>
                <a href="contato.html">Contato</a>
            </li>

            <li>

                <a href="#"
                   id="cart-btn">

                    <i class="fas fa-shopping-cart"></i>

                    <span id="cart-count">
                        0
                    </span>

                </a>

            </li>

        </ul>

    </nav>

</header>

<!-- CONTEÚDO -->

<main>

    <h1 class="section-title">
        Fale Conosco
    </h1>

    <div
        style="
        text-align:center;
        margin-bottom:2rem;
        ">

        <p style="margin-bottom:1rem;">

            Você também pode nos encontrar aqui:

        </p>

        <a
            href="https://wa.me/5511976456789"
            target="_blank"
            class="btn"

            style="
            background-color:#25D366;
            margin-right:10px;
            ">

            <i class="fab fa-whatsapp"></i>

            WhatsApp

        </a>

        <a
            href="https://www.instagram.com/coser.claudias"
            target="_blank"
            class="btn"

            style="
            background-color:#E1306C;
            ">

            <i class="fab fa-instagram"></i>

            Instagram

        </a>

    </div>

    <!-- FORMULÁRIO -->

    <div class="contact-container">

        <form id="contact-form">

            <div class="form-group">

                <label for="nome">

                    Nome

                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome completo"
                    required
                >

            </div>

            <div class="form-group">

                <label for="telefone">

                    Telefone

                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

            </div>

            <div class="form-group">

                <label for="mensagem">

                    Mensagem

                </label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    placeholder="Como podemos te ajudar?"
                    required
                ></textarea>

            </div>

            <button
                type="submit"
                class="btn submit-btn"
            >

                Enviar Mensagem

            </button>

        </form>

    </div>

</main>

<!-- FOOTER -->

<footer>

    <div class="footer-bottom">

        <p>

            &copy; 2026 Coser Clau Dias -
            Todos os direitos reservados.

        </p>

    </div>

</footer>

<!-- SCRIPT -->

<script src="script.js"></script>

<script>

document.getElementById('contact-form')

.addEventListener('submit', function(e) {

    e.preventDefault();

    const formData = new FormData(this);

    fetch('admin/salvar_mensagens.php', {

        method: 'POST',

        body: formData

    })

    .then(response => response.json())

    .then(data => {

        alert(
            'Mensagem enviada com sucesso! 💖'
        );

        document.getElementById('contact-form').reset();

    })

    .catch(error => {

        console.error(error);

        alert('Erro ao enviar mensagem.');

    });

});

</script>

</body>
</html>
